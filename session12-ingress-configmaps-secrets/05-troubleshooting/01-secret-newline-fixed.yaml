# FIX: encoded with `echo -n "S3cureP@ss" | base64` (no trailing newline)
apiVersion: v1
kind: Secret
metadata: {name: db-cred, namespace: s12-troubleshoot}
type: Opaque
data:
  DB_PASSWORD: UzNjdXJlUEBzcw==
---
apiVersion: v1
kind: Pod
metadata: {name: db-client, namespace: s12-troubleshoot}
spec:
  restartPolicy: Never
  containers:
    - name: client
      image: busybox:1.36
      # Simulates a DB login that expects exactly "S3cureP@ss"
      command: ["sh", "-c", "if [ \"$DB_PASSWORD\" = 'S3cureP@ss' ]; then echo 'LOGIN OK'; else echo \"FATAL: password authentication failed (got ${#DB_PASSWORD} chars, expected 10)\"; exit 1; fi"]
      env:
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: db-cred, key: DB_PASSWORD}}
