apiVersion: apps/v1
kind: Deployment
metadata: {name: shop, namespace: s12-troubleshoot}
spec:
  replicas: 2
  selector: {matchLabels: {app: shop}}
  template:
    metadata: {labels: {app: shop}}
    spec:
      containers:
        - name: shop
          image: hashicorp/http-echo:1.0
          args: ["-listen=:5678", "-text=Shop is UP"]
          ports: [{containerPort: 5678}]
---
apiVersion: v1
kind: Service
metadata: {name: shop-svc, namespace: s12-troubleshoot}
spec:
  selector: {app: shop-web}      # BUG 1: label does not match pods (app: shop)
  ports: [{port: 80, targetPort: 8080}]   # BUG 2: container listens on 5678
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: shop-ingress, namespace: s12-troubleshoot}
spec:
  ingressClassName: nginx
  rules:
    - host: shop.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: shop-svc, port: {number: 80}}}
