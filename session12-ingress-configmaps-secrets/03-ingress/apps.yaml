# Two small apps (frontend + backend) and a third "admin" app, each with a ClusterIP Service
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: s12-ingress}
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:1.0
          args: ["-listen=:5678", "-text=<h1>Hello from FRONTEND (Session 12 Ingress demo - Poorav)</h1>"]
          ports: [{containerPort: 5678}]
---
apiVersion: v1
kind: Service
metadata: {name: frontend-svc, namespace: s12-ingress}
spec:
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 5678}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: backend, namespace: s12-ingress}
spec:
  replicas: 2
  selector: {matchLabels: {app: backend}}
  template:
    metadata: {labels: {app: backend}}
    spec:
      containers:
        - name: api
          image: hashicorp/http-echo:1.0
          args: ["-listen=:5678", "-text={\"service\":\"backend-api\",\"status\":\"ok\"}"]
          ports: [{containerPort: 5678}]
---
apiVersion: v1
kind: Service
metadata: {name: backend-svc, namespace: s12-ingress}
spec:
  selector: {app: backend}
  ports: [{port: 80, targetPort: 5678}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: admin, namespace: s12-ingress}
spec:
  replicas: 1
  selector: {matchLabels: {app: admin}}
  template:
    metadata: {labels: {app: admin}}
    spec:
      containers:
        - name: admin
          image: hashicorp/http-echo:1.0
          args: ["-listen=:5678", "-text=<h1>ADMIN dashboard (host-based routing)</h1>"]
          ports: [{containerPort: 5678}]
---
apiVersion: v1
kind: Service
metadata: {name: admin-svc, namespace: s12-ingress}
spec:
  selector: {app: admin}
  ports: [{port: 80, targetPort: 5678}]
