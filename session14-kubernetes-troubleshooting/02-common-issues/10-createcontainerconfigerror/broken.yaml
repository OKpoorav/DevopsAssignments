apiVersion: v1
kind: Pod
metadata: {name: api-config, namespace: s14-issues}
spec:
  containers:
    - name: api
      image: busybox:1.36
      command: ["sh", "-c", "echo API_KEY length=${#API_KEY}; sleep 3600"]
      env:
        - name: API_KEY
          valueFrom:
            secretKeyRef: {name: api-secret, key: API_KEY}   # BUG: Secret api-secret does not exist
