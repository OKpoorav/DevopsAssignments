apiVersion: apps/v1
kind: Deployment
metadata: {name: orders, namespace: s14-issues}
spec:
  replicas: 2
  selector: {matchLabels: {app: orders}}
  template:
    metadata: {labels: {app: orders, version: v1}}
    spec:
      containers:
        - name: orders
          image: hashicorp/http-echo:1.0
          args: ["-listen=:5678", "-text=orders service OK"]
          ports: [{name: http, containerPort: 5678}]
---
apiVersion: v1
kind: Pod
metadata: {name: client, namespace: s14-issues}
spec:
  containers:
    - name: client
      image: curlimages/curl:8.6.0
      command: ["sleep", "3600"]
