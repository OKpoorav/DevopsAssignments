apiVersion: v1
kind: Namespace
metadata: {name: s14-dns-backend}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: inventory, namespace: s14-dns-backend}
spec:
  replicas: 1
  selector: {matchLabels: {app: inventory}}
  template:
    metadata: {labels: {app: inventory}}
    spec:
      containers:
        - name: inventory
          image: hashicorp/http-echo:1.0
          args: ["-listen=:5678", "-text=inventory: 42 items in stock"]
---
apiVersion: v1
kind: Service
metadata: {name: inventory-svc, namespace: s14-dns-backend}
spec:
  selector: {app: inventory}
  ports: [{port: 80, targetPort: 5678}]
