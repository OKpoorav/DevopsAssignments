# Backend "inventory" lives in namespace s14-dns-backend; client in s14-issues
apiVersion: v1
kind: Pod
metadata: {name: dns-client, namespace: s14-issues}
spec:
  restartPolicy: Never
  containers:
    - name: client
      image: curlimages/curl:8.6.0
      command: ["sh", "-c"]
      args:
        - |
          echo "calling inventory service..."
          curl -s --max-time 5 http://inventory-svc/ || echo "ERROR: could not reach http://inventory-svc/"   # BUG: short name only resolves in the SAME namespace
