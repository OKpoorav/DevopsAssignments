# Custom StorageClass using minikube's hostpath provisioner
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: s13-fast
provisioner: k8s.io/minikube-hostpath
reclaimPolicy: Delete
volumeBindingMode: Immediate   # minikube-hostpath provisioner lacks RBAC to read nodes, so WaitForFirstConsumer fails here (see README)
