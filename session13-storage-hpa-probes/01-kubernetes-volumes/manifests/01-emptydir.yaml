# emptyDir: scratch space shared by containers in the same Pod; deleted with the Pod
apiVersion: v1
kind: Pod
metadata: {name: emptydir-demo, namespace: s13-volumes}
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do date >> /cache/log.txt; sleep 5; done"]
      volumeMounts: [{name: cache, mountPath: /cache}]
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts: [{name: cache, mountPath: /shared}]
  volumes:
    - name: cache
      emptyDir:
        sizeLimit: 64Mi        # medium: Memory would use tmpfs (RAM)
