apiVersion: v1
kind: Pod
metadata: {name: pv-reader, namespace: s13-volumes}
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts: [{name: data, mountPath: /data}]
  volumes:
    - name: data
      persistentVolumeClaim: {claimName: static-claim}
