# Liveness: container deletes its health file after 25s -> probe fails -> kubelet RESTARTS the container
apiVersion: v1
kind: Pod
metadata: {name: liveness-demo, namespace: s13-probes}
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "touch /tmp/healthy; sleep 25; rm -f /tmp/healthy; sleep 600"]
      livenessProbe:
        exec: {command: ["cat", "/tmp/healthy"]}
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 2
