# Startup: slow app needs ~20s to boot. Startup probe allows up to 30x2s=60s;
# liveness/readiness only start after startup succeeds, so the slow boot is not killed.
apiVersion: v1
kind: Pod
metadata: {name: startup-demo, namespace: s13-probes}
spec:
  containers:
    - name: slow-app
      image: busybox:1.36
      command: ["sh", "-c", "echo booting...; sleep 20; touch /tmp/started; echo started; sleep 600"]
      startupProbe:
        exec: {command: ["cat", "/tmp/started"]}
        periodSeconds: 2
        failureThreshold: 30
      livenessProbe:
        exec: {command: ["cat", "/tmp/started"]}
        periodSeconds: 5
        failureThreshold: 1
