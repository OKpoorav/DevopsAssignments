# In-cluster load generator: 4 parallel infinite wget loops against the Service
apiVersion: apps/v1
kind: Deployment
metadata: {name: load-generator, namespace: s13-hpa}
spec:
  replicas: 1
  selector: {matchLabels: {app: load-generator}}
  template:
    metadata: {labels: {app: load-generator}}
    spec:
      containers:
        - name: load
          image: busybox:1.36
          command: ["sh", "-c", "for i in 1 2 3 4; do (while true; do wget -q -O- http://cpu-app.s13-hpa.svc.cluster.local >/dev/null; done) & done; wait"]
