# Declarative equivalent of: kubectl create deployment kubernetes-bootcamp --image=kubernetes-bootcamp:v1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-bootcamp
  namespace: s09-basics
  labels:
    app: kubernetes-bootcamp
spec:
  replicas: 4
  selector:
    matchLabels:
      app: kubernetes-bootcamp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: kubernetes-bootcamp
    spec:
      containers:
        - name: kubernetes-bootcamp
          image: kubernetes-bootcamp:v1   # locally built arm64 image (see bootcamp-app/)
          ports:
            - containerPort: 8080
