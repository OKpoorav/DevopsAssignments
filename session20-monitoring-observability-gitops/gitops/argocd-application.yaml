# Argo CD Application: watches apps/guestbook in the in-cluster Git repo and keeps the cluster in sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook
  namespace: s20-argocd
spec:
  project: default
  source:
    repoURL: git://git-server.s20-gitops.svc.cluster.local/gitops-demo.git
    targetRevision: main
    path: apps/guestbook
  destination:
    server: https://kubernetes.default.svc
    namespace: s20-guestbook
  syncPolicy:
    automated:
      prune: true      # delete resources removed from Git
      selfHeal: true   # revert manual changes made in the cluster (drift)
    syncOptions: [CreateNamespace=true]
