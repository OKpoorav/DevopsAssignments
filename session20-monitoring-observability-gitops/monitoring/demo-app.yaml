# Demo app: podinfo exposes Prometheus metrics on /metrics, health on /healthz and /readyz
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: s20-app
  labels: {app: podinfo}
spec:
  replicas: 2
  selector: {matchLabels: {app: podinfo}}
  template:
    metadata:
      labels: {app: podinfo}
    spec:
      containers:
      - name: podinfo
        image: ghcr.io/stefanprodan/podinfo:6.7.1
        ports:
        - {name: http, containerPort: 9898}
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {cpu: 300m, memory: 128Mi}
        livenessProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 10
        readinessProbe:
          httpGet: {path: /readyz, port: http}
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: s20-app
  labels: {app: podinfo}
spec:
  selector: {app: podinfo}
  ports:
  - {name: http, port: 9898, targetPort: http}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: podinfo
  namespace: s20-app
spec:
  selector: {matchLabels: {app: podinfo}}
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
